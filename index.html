<!DOCTYPE html>
<html>
<head>
    <title>Document Q&A Assistant</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
        h1 { color: #333; }
        input, button { padding: 10px; margin: 5px 0; width: 100%; box-sizing: border-box; }
        button { background: #4CAF50; color: white; border: none; cursor: pointer; }
        button:hover { background: #45a049; }
        #result { margin-top: 20px; padding: 15px; background: #f4f4f4; border-radius: 5px; }
        .section { margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid #ddd; }
        #docList { margin-top: 10px; padding: 10px; background: #f9f9f9; border-radius: 5px; }
        #docList ul { margin: 5px 0; padding-left: 20px; }
    </style>
</head>
<body>
    <h1>Document Q&A Assistant</h1>

    <div class="section">
        <h3>1. Upload a document</h3>
        <input type="file" id="fileInput">
        <button onclick="uploadFile()">Upload</button>
        <div id="uploadResult"></div>
        <button onclick="listDocuments()">Show Uploaded Documents</button>
        <button onclick="clearDocuments()" style="background: #d9534f;">Clear All Documents</button>
        <div id="docList"></div>
    </div>

    <div class="section">
        <h3>2. Ask a question</h3>
        <input type="text" id="questionInput" placeholder="Ask something about the document...">
        <button onclick="askQuestion()">Ask</button>
        <div id="result"></div>
    </div>

    <script>
        const BASE_URL = "http://127.0.0.1:8000";

        async function uploadFile() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            if (!file) {
                alert("Please select a file first.");
                return;
            }
            const formData = new FormData();
            formData.append('file', file);

            const response = await fetch(`${BASE_URL}/upload`, {
                method: 'POST',
                body: formData
            });
            const data = await response.json();
            document.getElementById('uploadResult').innerText =
                data.error ? `Error: ${data.error}` : `Uploaded: ${data.filename} (${data.num_chunks} chunks)`;
        }

        async function askQuestion() {
            const question = document.getElementById('questionInput').value;
            if (!question.trim()) {
                alert("Please enter a question.");
                return;
            }
            const response = await fetch(`${BASE_URL}/query?question=${encodeURIComponent(question)}`, {
                method: 'POST'
            });
            const data = await response.json();
            document.getElementById('result').innerText =
                data.error ? `Error: ${data.error}` : `Answer: ${data.answer}`;
        }

        async function listDocuments() {
            const response = await fetch(`${BASE_URL}/documents`);
            const data = await response.json();
            const list = data.documents.map(d => `<li>${d}</li>`).join('');
            document.getElementById('docList').innerHTML =
                `<p>Total chunks: ${data.total_chunks}</p><ul>${list}</ul>`;
        }

        async function clearDocuments() {
            if (!confirm("Are you sure you want to clear all documents?")) {
                return;
            }
            const response = await fetch(`${BASE_URL}/clear`, {
                method: 'DELETE'
            });
            const data = await response.json();
            document.getElementById('docList').innerText = data.message;
        }
    </script>
</body>
</html>
